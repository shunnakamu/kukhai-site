<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo 1: after VOP</title>
<style>
  :root{
    --bg:#080b0f; --panel:#0e141b; --panel-2:#121a23; --line:#1e2b36;
    --ink:#e7f0f4; --ink-2:#8fa6b3; --ink-3:#5b7180;
    --trace:#cfe3ea; --grid:#12202a; --hi:#ffcc33;
    --c0:#ff5a64; --c1:#ffa53a; --c2:#3ed68a; --c3:#6b8cff;
    --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
    --sans:"Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px}
  .app{max-width:1320px;margin:0 auto;padding:14px 16px 24px}
  .top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;border:1px solid var(--line);
    background:linear-gradient(180deg,var(--panel-2),var(--panel));padding:10px 14px;border-radius:8px}
  .rec{width:10px;height:10px;border-radius:50%;background:#ff4d5e;box-shadow:0 0 10px #ff4d5e;animation:b 1.4s infinite}
  @keyframes b{50%{opacity:.25}}
  .t1{font-weight:700}
  .flag{font:700 10px var(--mono);color:#0a0e12;background:#38e0c8;padding:2px 7px;border-radius:3px}
  .ctx{flex:1;min-width:240px;color:var(--ink-2)}
  .ctx b{color:var(--ink)}
  .tabs{display:flex;gap:6px}
  .tab{font:12px var(--sans);color:var(--ink);background:var(--panel-2);border:1px solid var(--line);
    padding:6px 12px;border-radius:6px;cursor:pointer}
  .tab[aria-pressed=true]{border-color:#38e0c8;color:#38e0c8}
  .scope{margin-top:12px;border:1px solid var(--line);border-radius:8px;background:#05080b;overflow:hidden}
  canvas{display:block;width:100%;height:auto}
  .bottom{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;margin-top:10px;
    border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:10px 14px}
  .legend{color:var(--ink-2)}
  .legend b{color:var(--ink)}
  .rel{margin-left:auto;font:700 17px var(--mono)}
  .rel .k{display:inline-block;border:2px solid var(--hi);background:rgba(255,204,51,.12);border-radius:6px;padding:0 6px;color:var(--hi)}
  .note{color:var(--ink-3);font-size:12px;margin-top:8px;line-height:1.6}
  .ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 12px 11px;border-top:1px solid var(--line);background:var(--panel)}
  .btn{font:12px var(--sans);color:var(--ink);background:var(--panel-2);border:1px solid var(--line);padding:6px 12px;border-radius:6px;cursor:pointer}
  .btn:hover{border-color:#38e0c8;color:#38e0c8}
  .btn:focus-visible{outline:2px solid #38e0c8;outline-offset:2px}
  .btn.sk{font-family:var(--mono);font-size:11px;padding:5px 9px}
  .ctrl input[type=range]{flex:1;min-width:140px;accent-color:#38e0c8;cursor:pointer}
  .ctrl .pos{font:12px var(--mono);color:var(--ink-2);font-variant-numeric:tabular-nums;min-width:92px;text-align:right}
  .ctrl .pos b{color:var(--ink)}
  .purpose{margin:0 0 12px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:10px 14px;color:var(--ink-2);font-size:13px;line-height:1.7}
  .purpose h2{font-size:14px;color:var(--ink);margin:0 0 4px}
  .purpose summary{cursor:pointer}
  .gloss{margin:0 0 12px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:10px 14px;color:var(--ink-2);font-size:13px;line-height:1.8}
  .gloss summary{cursor:pointer;color:var(--ink)}
  .gloss ol{margin:6px 0 4px;padding-left:1.4em}
  .gloss b{color:var(--ink)}
  .legend2{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
  .legend2 i{display:inline-block;width:10px;height:10px;border-radius:50%}
  .purpose b{color:var(--ink)}
  .purpose ol{margin:4px 0 0;padding-left:1.4em}
  #m4{position:relative} #m4.wait li{visibility:hidden}
  #m4.wait::before{content:"ペーシングをやめたところが来ると出ます";position:absolute;top:0;left:0;color:var(--ink-3);font-size:13px}
  .steps .step:not(:last-child),.top,.tabs,.note{display:none}
  #m4{position:relative} #m4.wait li{visibility:hidden}
  #m4.wait::before{content:"Fills in when pacing stops";position:absolute;top:0;left:0;color:var(--ink-3)}
  .steps{display:grid;grid-template-columns:1fr 1.2fr 1.3fr;gap:10px;margin-top:10px}
  @media(max-width:900px){.steps{grid-template-columns:1fr}}
  .step{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:10px 14px;min-height:150px}
  .step h3{margin:0 0 8px;font-size:13px;color:var(--ink-2);font-weight:700}
  .step h3 .n{display:inline-block;font:700 11px var(--mono);color:#0a0e12;background:#38e0c8;border-radius:4px;padding:1px 6px;margin-right:6px}
  .nums{font:15px var(--mono);line-height:1.9;color:var(--ink)}
  .nums .lab{color:var(--ink-2);font:12px var(--sans);margin-right:6px}
  .k{display:inline-block;border:2px solid var(--hi);background:rgba(255,204,51,.12);border-radius:6px;padding:0 5px;color:var(--hi);font-weight:700}
  .says{margin:0;padding-left:1.1em;font-size:15px;line-height:1.8}
  .says li{margin:2px 0}
  .says .dim{color:var(--ink-3);font-size:13px}
  #gc{width:100%;height:auto;display:block}
  /* KUχAI look for the short English demo pages (--simple), after kukhai.ai (tokens.css / site.css):
     navy paper with two fixed blooms, ivory ink, one cyan accent, Space Grotesk / Inter / JetBrains Mono.
     Appended after each page's own styles, so it only overrides. */
  :root{
    --bg:#090E18; --panel:rgba(16,22,31,.78); --panel-2:#151B26; --line:#2A303A;
    --ink:#F5F7FB; --ink-2:#b4bccb; --ink-3:#8590a3; --avg:#DDE3EC;
    --mono:"JetBrains Mono",ui-monospace,monospace; --sans:"Inter",ui-sans-serif,system-ui,sans-serif;
  }
  body{background-color:#090E18;color:var(--ink);font-family:var(--sans);font-weight:350;
    background-image:radial-gradient(60rem 40rem at 82% -10%,rgba(246,201,39,.20),transparent 70%),
      radial-gradient(48rem 36rem at -10% 62%,rgba(246,201,39,.13),transparent 72%);
    background-attachment:fixed;-webkit-font-smoothing:antialiased}
  .app{max-width:78rem;padding-inline:clamp(16px,4vw,72px)}
  .hero{padding:clamp(40px,7vw,88px) 0 clamp(28px,4vw,48px)}
  .hero h1{font-family:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;font-weight:700;letter-spacing:-.03em;
    line-height:1.08;font-size:clamp(2.5rem,4.4vw + 1rem,4.4rem);margin:0 0 24px;max-width:20ch;color:var(--ink)}
  .hero h1 .accent{color:#F6C927}
  .hero .sub{font-size:1.25rem;line-height:1.55;color:var(--ink-2);max-width:62ch;margin:0}
  .hero .meta{font:500 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:24px 0 0;line-height:1.8}
  .scope,.step,.box{background:var(--panel);border:1px solid var(--line);border-radius:10px}
  .ctrl{background:transparent;border-top-color:var(--line)}
  .btn,.bar button,.bar select{font-family:var(--sans);font-weight:500;background:transparent;color:var(--ink);
    border:1px solid #6b7890;border-radius:10px;padding:8px 16px}
  .btn:hover,.bar button:hover{border-color:#F6C927;color:#F6C927}
  .ctrl input[type=range],.bar input[type=range]{accent-color:#F6C927}
  .step h3 .n{background:#F6C927;color:#090E18}
  /* #193: the result, big above the charts (demo 1 verdict, demo 2 PPI-TCL) */
  .verdict{margin:0 0 16px;padding:18px 24px;background:var(--panel);border:1px solid #F6C927;border-radius:10px}
  .verdict.wait{border-color:var(--line)}
  .verdict .lab{font:500 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
  .verdict .big{font-family:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;font-weight:700;letter-spacing:-.02em;
    line-height:1.1;font-size:clamp(2rem,2.6vw + 1rem,3.2rem);color:#F6C927;margin-top:6px}
  .verdict .big small{font-size:.5em;font-weight:500;color:var(--ink)}
  .verdict.wait .big,.verdict .wait .big{color:var(--ink-3)}
  /* demo 1: answer and "waiting" share one cell, the rest keeps its room while hidden: the height never changes */
  .verdict .big:has(.ans){display:grid}
  .verdict .big .ans,.verdict .big .pending,.verdict .big .think{grid-area:1/1}
  .verdict .pending{visibility:hidden}
  .verdict.wait .pending,.verdict .wait .pending{visibility:visible}
  .verdict.wait .ans,.verdict .wait .ans,.verdict.wait .why,.verdict.wait .nums,.verdict .wait .v{visibility:hidden}
  /* demo 1: a short "reading" state between pacing stopping and the answer (same cell, so no layout change) */
  .verdict .think{visibility:hidden}
  .verdict.think .pending{visibility:hidden}
  .verdict.think .think{visibility:visible;color:var(--ink-2)}
  .verdict.think{border-color:#F6C927}
  .verdict .think i{font-style:normal;animation:vdot 1.2s infinite}
  .verdict .think i:nth-child(2){animation-delay:.2s} .verdict .think i:nth-child(3){animation-delay:.4s}
  @keyframes vdot{0%,100%{opacity:.15}50%{opacity:1}}
  /* demo 2: the same reading state per pacing train */
  .verdict .reading .pending{visibility:hidden}
  .verdict .reading .think{visibility:visible;color:var(--ink-2)}
  .verdict .why{font-size:1.05rem;line-height:1.6;color:var(--ink);margin-top:10px;max-width:80ch}
  .verdict .nums{font:500 17px var(--mono);color:var(--ink-2);margin-top:8px}
  .verdict .row{display:flex;flex-wrap:wrap;gap:16px 56px}
  /* demo 2: jump to an event */
  .jumps{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0 4px;font:500 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
  .jumps button{font:500 14px var(--sans);letter-spacing:0;text-transform:none;background:transparent;color:var(--ink);
    border:1px solid #6b7890;border-radius:10px;padding:6px 14px;cursor:pointer}
  .jumps button:hover{border-color:#F6C927;color:#F6C927}
</style>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@350;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

</div>

  for(let t=Math.ceil(tL/200)*200;t<tNow;t+=200){const X=Math.round(x(t))+.5;ctx.beginPath();ctx.moveTo(X,16);ctx.lineTo(X,H-20);ctx.stroke();}
  ctx.font="13px "+MONO; ctx.textBaseline="middle";
  F.rows.forEach((row,i)=>{
    const y0=ROW_Y[i], g=GAIN[i];
    ctx.fillStyle=COL.ink2; ctx.textAlign="right"; ctx.fillText(row.n,LW-12,y0);
    ctx.strokeStyle=COL.trace; ctx.lineWidth=1.1; ctx.beginPath();
    for(let p=0;p<PW;p++){
      const [mn,mx]=sampleRow(row,(px0+p)*MS_PER_PX), X=LW+p;
      if(p===0) ctx.moveTo(X,y0-mx*g);
      ctx.lineTo(X,y0-mx*g); ctx.lineTo(X,y0-mn*g);
    }
    ctx.stroke();
  });
  const EV=eventsAround(tL,tNow);
  // 印
  ctx.textAlign="center";
  for(const e of EV){
    if(e.t<tL||e.t>tNow||x(e.t)<LW+8) continue;
    if(e.type==="S"){ ctx.fillStyle=COL.ink3; ctx.font="11px "+MONO; ctx.fillText("S",x(e.t),yS); continue; }
    ctx.font="bold 20px "+SANS; ctx.fillStyle=e.c<0?COL.ink3:COL.beat[e.c];
    ctx.fillText(e.type, x(e.t), e.type==="A" ? yA : yV);
  }
  // A の間隔（論文の図の値）。両端の A が出てから表示する
  const rel={}, As=EV.filter(e=>e.type==="A");
  const curR=Math.floor(tNow/REP), retShown=As.some((a,i)=>i>0 && As[i-1].i===F.ret && As[i-1].r===curR && a.r===curR && a.t<=tNow);   // 次の間隔が出るまで「最後」の枠を付けない
  for(let i=1;i<As.length;i++){
    const a0=As[i-1], a1=As[i];
    if(a0.r!==a1.r || a1.t>tNow || a1.t<tL) continue;
    const cur0 = a0.r===Math.floor(tNow/REP);              // 前の回の区間は枠を付けず灰色
    const v=F.AA[a0.i], key = !cur0 ? null : a0.i===F.lastPaced && retShown ? "lastPaced" : a0.i===F.ret ? "return" : a0.i===F.ret+1 ? "next" : null;
    if(key) rel[key]=v;
    const xm=(x(a0.t)+x(a1.t))/2; if(xm<LW+30) continue;
    if(key){
      ctx.strokeStyle=COL.hi; ctx.lineWidth=2.5; ctx.fillStyle="rgba(255,204,51,.14)";
      ctx.beginPath(); ctx.roundRect(xm-34,yA-17,68,34,7); ctx.fill(); ctx.stroke();
      ctx.fillStyle=COL.hi; ctx.font="bold 22px "+MONO;
    } else { ctx.fillStyle=cur0?COL.ink:COL.ink3; ctx.font="19px "+MONO; }
    ctx.fillText(String(v),xm,yA);
  }
  { const rN=Math.floor(tNow/REP), Vs=EV.filter(e=>e.type==="V"&&e.r===rN).sort((a,b)=>a.t-b.t), Pz=Vs.filter(e=>e.paced), sL=Pz[Pz.length-1];
    ctx.textAlign="center";
    for(let i=1;i<Vs.length;i++){ const a=Vs[i-1], b=Vs[i]; if(b.t>tNow||b.t<tL) continue;
      const xm=(x(a.t)+x(b.t))/2; if(xm<LW+30) continue;
      // the paced V-V is the stimulus interval; after pacing, the measured stimulus → V and V-V (same values as the verdict box)
      let v=Math.round(b.t-a.t), key=false;
      if(a.paced&&b.paced) v=F.SS[Pz.indexOf(a)];
      else if(a===sL){ v=VV[K].stop; key=true; }
      else if(sL&&a.t>sL.t) v=VV[K].post[Vs.indexOf(a)-Vs.indexOf(sL)-1]??v;
      if(key){ ctx.strokeStyle=COL.hi; ctx.lineWidth=2.5; ctx.fillStyle="rgba(255,204,51,.14)";
        ctx.beginPath(); ctx.roundRect(xm-34,yV-17,68,34,7); ctx.fill(); ctx.stroke(); ctx.fillStyle=COL.hi; ctx.font="bold 22px "+MONO; }
      else { ctx.fillStyle=COL.ink; ctx.font="19px "+MONO; }
      ctx.fillText(String(v),xm,yV); }
    // which row is which interval (中村 2026-10-26「RR, PP は」; 10/22 の会議で RR と PP を両方出す話)
    ctx.fillStyle=COL.ink2; ctx.font="bold 16px "+MONO; ctx.textAlign="left"; ctx.fillText("RR",10,yV); ctx.fillText("PP",10,yA); }
  { const THINK=3500, ms=F.msPerCol, s=F.S[F.S.length-1]*ms, v1=F.V.filter(v=>!v[2]).map(v=>v[0]*ms).find(t=>t>s+1);
    const tD=Math.max(F.A[F.ret+1][0]*ms, v1, s+F.pcl+10), u=tNow-Math.floor(tNow/REP)*REP;
    const st=u<tD?"wait":u<tD+THINK?"think":"done", el=document.getElementById("verdict");
    el.classList.toggle("wait",st!=="done"); el.classList.toggle("think",st==="think");
    document.getElementById("m4").classList.toggle("wait",st!=="done"); }
  // ペーシング間隔（論文の図の値）
  ctx.font="17px "+MONO; ctx.fillStyle=COL.ink2;
  const Ss=EV.filter(e=>e.type==="S");
  for(let i=1;i<Ss.length;i++){
    const s0=Ss[i-1], s1=Ss[i], xm=(x(s0.t)+x(s1.t))/2;
    if(s0.r!==s1.r||s1.t>tNow||s1.t<tL||xm<LW+30) continue;
    ctx.fillText(String(F.SS[s0.i]),xm,yS);
  }
  ctx.fillStyle=COL.ink3; ctx.textAlign="left"; ctx.fillText("Pacing",8,yS);
  updateSteps(EV,tNow);
  const inRep=((simT%REP)+REP)%REP;
  seek.value=String((inRep/1000).toFixed(2));
  const pos=(inRep/1000).toFixed(1); if(posEl.textContent!==pos) posEl.textContent=pos;
}

/* 再生・停止・シーク（シークは 1 回分の中の位置。回の番号は保つ＝色の並びが飛ばない） */
function setPlaying(p){
  playing=p; playBtn.textContent=p?"■ Stop":"▶ Play"; playBtn.setAttribute("aria-label",p?"Stop":"Play");
  if(p){ last=performance.now(); requestAnimationFrame(loop); }
}
function seekTo(sec){ const base=Math.floor(simT/REP)*REP; simT=base+Math.max(0,Math.min(sec*1000,REP-1)); draw(); }
function step(ms){ simT=Math.max(0,simT+ms); draw(); }
function loop(now){
  if(!playing) return;
  simT+=Math.min(now-last,100); last=now;                 // 実時間で流す
  draw(); requestAnimationFrame(loop);
}
playBtn.onclick=()=>setPlaying(!playing);
document.getElementById("skBack").onclick=()=>step(-1000);
document.getElementById("skFwd").onclick=()=>step(1000);
seek.addEventListener("input",e=>seekTo(parseFloat(e.target.value)));
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT") return;
  if(e.key===" "){ e.preventDefault(); setPlaying(!playing); }
  if(e.key==="ArrowLeft"){ e.preventDefault(); step(-1000); }
  if(e.key==="ArrowRight"){ e.preventDefault(); step(1000); }
});
const tabs=document.getElementById("tabs");
Object.keys(SCN).forEach(k=>{const b=document.createElement("button");b.className="tab";b.dataset.k=k;b.textContent=SCN[k].name;
  b.onclick=()=>{ setPlaying(false); setScn(k); }; tabs.appendChild(b);});
// ?s=B|C|D&t=秒 で、その場面・位置で開く（確認・スクリーンショット用）
const Q=new URLSearchParams(location.search);
setScn("R");
if(Q.has("t")) seekTo(Number(Q.get("t")));
</script>

<script>
(function(){
  // play only while the demo is on screen (中村 2026-10-28: start when scrolled into view, not on page load).
  // An IntersectionObserver inside the iframe measures against the top-level viewport.
  var autoPaused = false;
  function vis(on){ try {
    if (typeof setPlaying !== 'function') return;
    if (on && !playing && (autoPaused || !vis.started)) { vis.started = true; autoPaused = false; setPlaying(true); }
    else if (!on && playing) { autoPaused = true; setPlaying(false); }
  } catch (e) {} }
  if (window.IntersectionObserver) {
    new IntersectionObserver(function(es){ es.forEach(function(e){ vis(e.intersectionRatio >= 0.5); }); },
      {threshold: [0, 0.5, 1]}).observe(document.querySelector('.app') || document.body);
  } else { setTimeout(function(){ vis(true); }, 600); }
  // the content's own height: documentElement.scrollHeight never drops below the iframe, so the frame could only grow
  function report(){ try { var a = document.querySelector('.app') || document.body;
    parent.postMessage({kukhaiDemoHeight: Math.ceil(a.getBoundingClientRect().bottom + window.scrollY)}, '*'); } catch (e) {} }
  window.addEventListener('load', report); window.addEventListener('resize', report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.body);
})();
</script>
